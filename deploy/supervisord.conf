; Giữ 4 tiến trình luôn chạy; tiến trình nào dừng thì tự khởi động lại riêng nó.
; Log của mọi tiến trình đổ ra stdout để xem trên Render Logs.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Phần mềm lương + Dịch vụ nhà xưởng: dùng nguyên biến môi trường hiện có của service.
; Tham số dòng lệnh ghi đè workers=2/sync trong gunicorn.conf.py để tiết kiệm RAM.
[program:hrm]
directory=/app/hrm
command=/opt/venv/hrm/bin/gunicorn -c gunicorn.conf.py --bind 127.0.0.1:8101 --workers 1 --worker-class gthread --threads 4 --max-requests 1000 --max-requests-jitter 100 config.wsgi:application
priority=20
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; CO: chỉ nhận biến CO_* (đã bỏ tiền tố), chạy dưới đường dẫn /co.
[program:co]
directory=/app/co/CO_Manager
command=/usr/local/bin/python /app/hrm/deploy/with_env.py CO_ SCRIPT_NAME=/co STATIC_URL=/co/static/ -- /opt/venv/co/bin/gunicorn --bind 127.0.0.1:8102 --workers 1 --worker-class gthread --threads 4 --timeout 120 --max-requests 1000 --max-requests-jitter 100 --access-logfile - CO_Manager.wsgi:application
priority=30
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Tính giá: chỉ nhận biến TINHGIA_* (đã bỏ tiền tố), chạy dưới đường dẫn /tinh-gia.
; config/gunicorn.py của Tính giá vẫn kiểm tra DB + static manifest trước khi nhận request.
[program:tinhgia]
directory=/app/tinhgia
command=/usr/local/bin/python /app/hrm/deploy/with_env.py TINHGIA_ SCRIPT_NAME=/tinh-gia PORT=8103 APP_ENV=production DJANGO_SETTINGS_MODULE=config.production DJANGO_STATIC_URL=/tinh-gia/static/ DJANGO_STATIC_ROOT=/app/tinhgia/staticfiles -- /opt/venv/tinhgia/bin/gunicorn -c config/gunicorn.py --bind 127.0.0.1:8103 config.wsgi:application
priority=30
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
